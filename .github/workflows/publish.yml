name: Publish npm package

on:
  push:
    tags: ['v*']
  # Manual runs on master validate the pipeline without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        run: node scripts/release-metadata.js
      - name: Require a commit merged into master
        run: git merge-base --is-ancestor HEAD origin/master

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pack and test the release artifact
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          install_dir=$(mktemp -d)
          npm install --prefix "$install_dir" --ignore-scripts --omit=dev --no-audit --no-fund "$RUNNER_TEMP/cors-forward-$RELEASE_VERSION.tgz"
          node scripts/smoke-package.js "$install_dir" "$RELEASE_VERSION"
          cp scripts/check-publish-version.js "$RUNNER_TEMP/check-publish-version.js"
          cd "$RUNNER_TEMP"
          sha256sum "cors-forward-$RELEASE_VERSION.tgz" check-publish-version.js > "cors-forward-$RELEASE_VERSION.tgz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/cors-forward-${{ env.RELEASE_VERSION }}.tgz
            ${{ runner.temp }}/cors-forward-${{ env.RELEASE_VERSION }}.tgz.sha256
            ${{ runner.temp }}/check-publish-version.js
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    # All versions share this lock; testing and packaging remain parallel.
    concurrency:
      group: npm-publish-cors-forward
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
    steps:
      # No checkout, dependency installation or package scripts in the OIDC job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-package
          path: package
      - name: Publish the verified artifact using OIDC
        working-directory: package
        run: |
          sha256sum --check "cors-forward-$RELEASE_VERSION.tgz.sha256"
          node check-publish-version.js "$RELEASE_VERSION" "$RELEASE_DIST_TAG"
          npm publish "./cors-forward-$RELEASE_VERSION.tgz" --ignore-scripts --access public --tag "$RELEASE_DIST_TAG"
